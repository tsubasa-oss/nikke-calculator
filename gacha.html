<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKE オバロシミュレーター ＆ ガチャ確率計算機</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --border-color: #2a364f;
            --accent-color: #00f0ff;
            --accent-yellow: #ffb700;
            --text-color: #e0e6ed;
            --text-dim: #8a99ad;
            --danger-color: #ff4757;
            --pilgrim-color: #ff6b81;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-weight: bold;
            color: var(--accent-color);
        }

        .card-title.pilgrim {
            color: var(--pilgrim-color);
        }

        .lock-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--accent-yellow);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-panel {
            background: linear-gradient(135deg, #151c2c 0%, #1e293b 100%);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .res-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            text-align: center;
        }

        .res-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
        }

        .res-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .res-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .res-value.pilgrim {
            color: var(--pilgrim-color);
        }

        .res-sub {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            margin-top: 4px;
        }

        .info-note {
            background-color: rgba(255, 183, 0, 0.1);
            border-left: 3px solid var(--accent-yellow);
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
            line-height: 1.5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .calc-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: #0b0f19;
            border: none;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s;
            margin-top: 4px;
        }

        .calc-btn:hover {
            background-color: #00c2cc;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .footer {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.85rem;
            color: var(--text-dim);
            padding-bottom: 10px;
        }

        .footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-yellow);
            text-decoration: underline;
        }

        .nav-btn {
            background-color: #1e293b;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-btn:hover {
            background-color: var(--accent-color);
            color: #0b0f19;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ページ1: オバロシミュレーター -->
    <div id="page-overload">
        <h1>NIKKE オバロシミュレーター</h1>
        <div class="subtitle">1〜3段目の個別条件指定・重複除外・ロック消費対応</div>

        <div class="info-note">
            <strong>仕様要点:</strong> ロック0個=1消費 / ロック1個=2消費 / ロック2個=3消費。<br>
