<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKE オバロ再製造 確率＆必要ドングリ計算機</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --border-color: #2a364f;
            --accent-color: #00f0ff;
            --accent-yellow: #ffb700;
            --text-color: #e0e6ed;
            --text-dim: #8a99ad;
            --danger-color: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 8px;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-bottom: 24px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-title {
            font-weight: bold;
            color: var(--accent-color);
        }

        .lock-checkbox {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--accent-yellow);
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        select {
            width: 100%;
            padding: 8px;
            background-color: #0b0f19;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-panel {
            background: linear-gradient(135deg, #151c2c 0%, #1e293b 100%);
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .res-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            text-align: center;
        }

        .res-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 6px;
        }

        .res-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .res-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .res-sub {
            font-size: 0.75rem;
            color: var(--accent-yellow);
            margin-top: 4px;
        }

        .info-note {
            background-color: rgba(255, 183, 0, 0.1);
            border-left: 3px solid var(--accent-yellow);
            padding: 10px 14px;
            font-size: 0.85rem;
            color: #d1d5db;
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #1e293b;
            color: var(--accent-color);
        }

        tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NIKKE オバロシミュレーター</h1>
    <div class="subtitle">1〜3段目の個別条件指定・重複除外・ロック消費対応</div>

    <div class="info-note">
        <strong>仕様要点:</strong> ロック0個=1消費 / ロック1個=2消費 / ロック2個=3消費。<br>
        付与確率: 1段目 100% / 2段目 50% / 3段目 30%。他の枠で出たオプションは重複しません。
    </div>

    <!-- 1〜3段目の設定カード -->
    <div class="grid-3">
        <!-- 1段目 -->
        <div class="card" id="card-1">
            <div class="card-header">
                <span class="card-title">1段目 (付与率 100%)</span>
                <label class="lock-checkbox">
                    <input type="checkbox" id="lock-1" onchange="updateCalc()"> ロック中
                </label>
            </div>
            <div class="form-group">
                <label>狙うオプション</label>
                <select id="opt-1" onchange="updateCalc()">
                    <option value="any">指定なし (任意)</option>
                    <option value="none">付与なし (空き)</option>
                    <option value="atk">攻撃力増加 (10%)</option>
                    <option value="ammo">最大装弾数増加 (12%)</option>
                    <option value="element">有利コードダメージ増加 (10%)</option>
                    <option value="crit_dmg">クリティカルダメージ増加 (12%)</option>
                    <option value="crit_rate">クリティカル率増加 (10%)</option>
                    <option value="charge_speed">チャージ速度増加 (12%)</option>
                    <option value="charge_dmg">チャージダメージ増加 (12%)</option>
                    <option value="hit">命中率増加 (12%)</option>
                    <option value="def">防御力増加 (10%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>数値・ランク指定</label>
                <select id="rank-1" onchange="updateCalc()">
                    <option value="1">ランク1以上 (全数値)</option>
                    <option value="8">ランク8以上 (上級 40%)</option>
                    <option value="11">ランク11以上 (特級 5%)</option>
                    <option value="15">ランク15のみ (最高 0.33%)</option>
                </select>
            </div>
        </div>

        <!-- 2段目 -->
        <div class="card" id="card-2">
            <div class="card-header">
                <span class="card-title">2段目 (付与率 50%)</span>
                <label class="lock-checkbox">
                    <input type="checkbox" id="lock-2" onchange="updateCalc()"> ロック中
                </label>
            </div>
            <div class="form-group">
                <label>狙うオプション</label>
                <select id="opt-2" onchange="updateCalc()">

                    <option value="none">付与なし (空き)</option>
                    <option value="atk">攻撃力増加 (10%)</option>
                    <option value="ammo">最大装弾数増加 (12%)</option>
                    <option value="element">有利コードダメージ増加 (10%)</option>
                    <option value="crit_dmg">クリティカルダメージ増加 (12%)</option>
                    <option value="crit_rate">クリティカル率増加 (10%)</option>
                    <option value="charge_speed">チャージ速度増加 (12%)</option>
                    <option value="charge_dmg">チャージダメージ増加 (12%)</option>
                    <option value="hit">命中率増加 (12%)</option>
                    <option value="def">防御力増加 (10%)</option>
                </select>
            </div>
            <div class="form-group">
                <label>数値・ランク指定</label>
                <select id="rank-2" onchange="updateCalc()">
                    <option value="1">ランク1以上 (全数値)</option>
                    <option value="8">ランク8以上 (上級 40%)</option>
                    <option value="11">ランク11以上 (特級 5%)</option>
                    <option value="15">ランク15のみ (最高 0.33%)</option>
                </select>
            </div>
        </div>
